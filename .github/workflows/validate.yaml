name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# A newer push to the same branch cancels the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hacs:
    # Pull requests from branches of this repository are already tested by
    # their push; only pull requests from forks run here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  tests:
    # Pull requests from branches of this repository are already tested by
    # their push; only pull requests from forks run here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install the test dependencies
        run: pip install -r requirements_test.txt
      - name: Run the tests
        run: pytest -q

  build-cards:
    # Pull requests from branches of this repository are already tested by
    # their push; only pull requests from forks run here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - name: Type check and build the dashboard cards
        working-directory: cards
        run: |
          npm ci
          npm run build
          test -s ../custom_components/wow_blizzard/www/wow-cards.js
